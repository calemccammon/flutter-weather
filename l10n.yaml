# Settings for `flutter gen-l10n`, which turns lib/l10n/app_en.arb into the
# AppLocalizations class. It runs on `flutter pub get` and on every build.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-dir: lib/l10n/generated
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
format: true
