# Static analysis for this project. Run with `flutter analyze`; CI fails on
# any finding, including infos.
#
# Base rule set: the Flutter team's recommended lints.
include: package:flutter_lints/flutter.yaml

# Riverpod's own checks (missing ProviderScope, misuse of ref, and so on).
# Loaded by the analyzer as a plugin; reported by `flutter analyze` too.
plugins:
  riverpod_lint: ^3.2.0

analyzer:
  language:
    # No implicit casts from dynamic, no inferring dynamic where a type could
    # not be worked out, no raw generic types such as a bare `List`. Worth
    # having when parsing JSON.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # A missing required argument or return is a mistake, not a hint.
    missing_required_param: error
    missing_return: error
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - linux/**
    # Generated by json_serializable.
    - "**/*.g.dart"

linter:
  rules:
    # Additions to flutter_lints. Remove any you find more noise than help.
    always_declare_return_types: true
    avoid_dynamic_calls: true
    cancel_subscriptions: true
    close_sinks: true
    directives_ordering: true
    discarded_futures: true
    prefer_final_locals: true
    prefer_single_quotes: true
    unawaited_futures: true
    use_super_parameters: true
