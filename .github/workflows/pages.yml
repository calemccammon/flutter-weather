name: Deploy to GitHub Pages

# Runs only when started by hand from the Actions tab. GitHub Pages needs a
# public repository on the free plan; until then this workflow will fail at
# the "Configure Pages" step. Once it works, add a push trigger on main to
# deploy on every merge.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      # A project page is served from /<repository name>/.
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      # Serve the app for unknown paths too, so deep links survive a reload.
      - run: cp build/web/index.html build/web/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
