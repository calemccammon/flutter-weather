name: flutter_weather
description: "Weather app in Flutter: search for a place and see its forecast."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.5.0
  http: ^1.6.0
  intl: ^0.20.3
  latlong2: ^0.10.1
  material_ui: ^1.1.0
  meta: ^1.19.0
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n; settings are in l10n.yaml.
  generate: true
