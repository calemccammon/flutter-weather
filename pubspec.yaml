name: flutter_weather
description: "Weather app in Flutter: search for a place and see its forecast."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  geolocator: ^14.1.2
  go_router: ^18.1.4
  http: ^1.6.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  maplibre_gl: ^0.28.0
  material_ui: ^1.1.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  json_serializable: ^6.15.2
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
